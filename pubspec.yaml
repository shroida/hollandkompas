name: hollandkompas

description: "A Dutch language learning platform designed for Arabic-speaking learners, offering structured courses, vocabulary, flashcards, exercises, progress tracking, and interactive learning tools from A1 to C1."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  go_router: ^17.3.0
  supabase_flutter: ^2.16.0
  hive_flutter: ^1.1.0
  just_audio: ^0.10.6
  youtube_player_iframe: ^6.0.2
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.3
  json_serializable: ^6.13.0
  freezed: ^3.2.5
  json_annotation: ^4.11.0
  freezed_annotation: ^3.1.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  video_player: ^2.11.1
  flutter_tts: ^4.2.5

  integration_test:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/logo.jpeg"

  adaptive_icon_background: "#F8FAFF"
  adaptive_icon_foreground: "assets/logo.jpeg"
  adaptive_icon_foreground_inset: 0

  web:
    generate: true
    image_path: "assets/logo.jpeg"
    background_color: "#F8FAFF"
    theme_color: "#FF6B00"

  windows:
    generate: true
    image_path: "assets/logo.jpeg"

  macos:
    generate: true
    image_path: "assets/logo.jpeg"

flutter:
  uses-material-design: true

  assets:
    - assets/logo.jpeg

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900
