name: Test Supabase Keep Alive

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Check Supabase Connection
        run: |
          curl -i -sS \
            "${{ secrets.SUPABASE_URL }}/rest/v1/test_connection?select=*" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
