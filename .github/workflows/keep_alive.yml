name: Test Supabase Keep Alive

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Keep Supabase active every 30 seconds
        run: |
          for i in {1..10}; do
            echo "Ping #$i - $(date -u)"

            curl -f -sS -X POST \
              "${{ secrets.SUPABASE_URL }}/rest/v1/test_connection" \
              -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=representation" \
              -d "{\"note\":\"keep-alive ping #$i - $(date -u +'%Y-%m-%d %H:%M:%S UTC')\"}"

            echo ""
            sleep 30
          done
